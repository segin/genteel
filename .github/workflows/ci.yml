name: CI

# One run per change: pushes to main, and pull requests into main.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings fail CI; the crate roots do not deny warnings themselves, so a
  # newer local toolchain's lints never break a local build.
  RUSTFLAGS: -Dwarnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all --check
    - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check

  clippy:
    name: Clippy (all targets)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - run: cargo clippy --locked --all-targets

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Run Rust tests
      run: cargo test --locked
    - name: Run Python tests
      run: python3 -m unittest discover tests

  headless:
    name: Headless build (no default features)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    # No GUI system libraries are installed: this must build without them.
    - run: cargo build --locked --no-default-features
    - run: cargo check --locked --no-default-features --all-targets

  fuzz:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Type-checking the targets needs no sanitizer support, so stable is
    # enough; running them with cargo-fuzz needs nightly.
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: fuzz
    - run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
