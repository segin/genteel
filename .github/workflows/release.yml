name: Release Builds

# Release archives are built for v* tags (and on demand); ordinary pushes
# and pull requests are covered by CI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege: only the publish job can write (to create the Release).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: genteel-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: genteel-windows

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev pkg-config

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Build
      run: cargo build --locked --release --target ${{ matrix.target }}

    - name: Prepare Artifacts (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p release
        cp target/${{ matrix.target }}/release/genteel release/
        cd release && zip -r ../genteel-linux.zip .

    - name: Prepare Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir release
        copy target\${{ matrix.target }}\release\genteel.exe release\
        Compress-Archive -Path release\* -DestinationPath genteel-windows.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.zip

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v5
      with:
        path: dist
        merge-multiple: true
    - uses: softprops/action-gh-release@v2
      with:
        files: dist/*.zip
        generate_release_notes: true
