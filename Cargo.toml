[package]
name = "genteel"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
# MSRV-aware dependency resolution: `cargo update` picks versions that
# build on `rust-version`.
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["gui"]
gilrs = ["dep:gilrs"]
gui = ["dep:cpal", "dep:winit", "dep:pixels", "dep:egui", "dep:egui-winit", "dep:egui-wgpu", "dep:rfd", "gilrs"]
test_headless = ["dep:winit"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6.1"
zip = "9.1"
log = "0.4"
env_logger = "0.11"

# Pure Rust windowing, rendering, and audio
winit = { version = "0.30.13", optional = true }
pixels = { version = "0.17", optional = true }
cpal = { version = "0.18", optional = true }
gilrs = { version = "0.11", optional = true }
rand = { version = "0.10.0", features = ["std_rng"] }
egui = { version = "0.35", optional = true }
egui-winit = { version = "0.35", optional = true, default-features = false, features = ["links"] }
egui-wgpu = { version = "0.35", optional = true }
rfd = { version = "0.17", optional = true }
image = { version = "0.25.9", default-features = false, features = ["png"] }

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12"

[[bench]]
name = "gui_bench"
harness = false
required-features = ["gui"]

[[bench]]
name = "gui_texture_clone"
harness = false
required-features = ["gui"]

[profile.release]
lto = "thin"
codegen-units = 1
