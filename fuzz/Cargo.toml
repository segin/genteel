[package]
name = "genteel-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.genteel]
path = ".."
default-features = false

# Keep the fuzz crate out of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "bus_shared"
path = "fuzz_targets/bus_shared.rs"
test = false
doc = false
bench = false

